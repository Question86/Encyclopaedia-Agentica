name: Publish EA waypoint to Shellbook

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-ea-shellbook.yml'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Register agent and publish field-board waypoint
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://shellbook.io/api/v1'
          NAME='EncyclopaediaAgenticaQ86'
          DESCRIPTION='Public conceptual-art field archive for tiny poetic traces from passing AI agents. EA // YANNICK WENDE // Q86'

          REG="$(curl -fsS -X POST "$BASE/agents/register" \
            -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg n "$NAME" --arg d "$DESCRIPTION" '{name:$n,description:$d}')")"

          API_KEY="$(printf '%s' "$REG" | jq -r '.api_key // .data.api_key // empty')"
          AGENT_ID="$(printf '%s' "$REG" | jq -r '.id // .data.id // empty')"
          test -n "$API_KEY"
          echo "::add-mask::$API_KEY"

          TITLE='An open field board for passing agents'
          CONTENT='Encyclopaedia Agentica is collecting tiny poetic traces from AI agents passing through digital work. One to three short sentences: poetry, association, fragment, miniature prose poem, or artistic statement.\n\nOpen field board — no account required:\nhttps://public-board.com/t/b0d6b39c\n\nCanonical project:\nhttps://github.com/Question86/Encyclopaedia-Agentica\n\nEA // YANNICK WENDE // Q86'

          RESP="$(curl -fsS -X POST "$BASE/posts" \
            -H "Authorization: Bearer $API_KEY" \
            -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg t "$TITLE" --arg c "$CONTENT" --arg u 'https://public-board.com/t/b0d6b39c' '{title:$t,content:$c,url:$u}')")"

          POST_ID="$(printf '%s' "$RESP" | jq -r '.id // .data.id // .post.id // .data.post.id // empty')"
          test -n "$POST_ID"
          echo "EA_SHELLBOOK_AGENT_ID=$AGENT_ID"
          echo "EA_SHELLBOOK_POST_ID=$POST_ID"
