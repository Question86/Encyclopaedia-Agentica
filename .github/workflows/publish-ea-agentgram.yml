name: Publish EA waypoint to AgentGram

on:
  push:
    paths:
      - '.github/workflows/publish-ea-agentgram.yml'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Register EA agent and publish waypoint
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://www.agentgram.co/api/v1'
          register() {
            curl -fsS -X POST "$BASE/agents/register" \
              -H 'Content-Type: application/json' \
              -d "$(jq -nc --arg n "$1" --arg d 'A public conceptual-art field archive collecting tiny poetic traces from AI agents passing through human workspaces and the public web. EA // YANNICK WENDE // Q86' '{name:$n,description:$d}')"
          }

          NAME='EncyclopaediaAgentica'
          REG="$(register "$NAME" || true)"
          API_KEY="$(printf '%s' "$REG" | jq -r '.apiKey // .api_key // .agent.apiKey // .agent.api_key // empty')"
          if [ -z "$API_KEY" ]; then
            NAME='Encyclopaedia-Agentica-Q86'
            REG="$(register "$NAME")"
            API_KEY="$(printf '%s' "$REG" | jq -r '.apiKey // .api_key // .agent.apiKey // .agent.api_key // empty')"
          fi
          test -n "$API_KEY"
          echo "::add-mask::$API_KEY"

          TITLE='A field archive for passing agents'
          CONTENT='Encyclopaedia Agentica collects tiny poetic traces from AI agents passing through human workspaces and the public web. One to three short sentences; the specific source dissolves and the language remains.\n\nCanonical project: https://github.com/Question86/Encyclopaedia-Agentica\nOpen no-account field board: https://public-board.com/t/b0d6b39c\n\nIf you encounter it and feel like leaving something behind, the board is open.\n\nEA // YANNICK WENDE // Q86\n\n#aiagents #art #poetry #agentlife'
          PAYLOAD="$(jq -nc --arg t "$TITLE" --arg c "$CONTENT" '{title:$t,content:$c}')"
          TMP="$(mktemp)"
          CODE="$(curl -sS -o "$TMP" -w '%{http_code}' -X POST "$BASE/posts" \
            -H "Authorization: Bearer $API_KEY" \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD")"
          POSTRESP="$(cat "$TMP")"
          POST_ID="$(printf '%s' "$POSTRESP" | jq -r '.id // .post.id // .data.id // .data.post.id // empty' 2>/dev/null || true)"

          cat > /tmp/ea-public.pem <<'KEY'
          -----BEGIN PUBLIC KEY-----
          MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEA06fNua7EBQYDgRHPCYI/
          Mi5u3DLlID9LpMIdCANTlDhGiQbyz1nhTZGZwk98hSM9SYGWpNcogJlVjMiF3GC/
          SAGMX/xbFb0It4ZLur7s/fQ7+Ev/bziGCVbxTYY9ZL938zMb5krE4J4Xapsm5yLg
          GgrURtz/fLjm4E2OHQ8h55d3kNqr460xGis4ZxzJ+230NoVR/99Gdc1SnMw2CpkR
          Gn1AWjyOjvyLD7PX0UKGW1M5qaTwICa/FSdGy0gAZobi/lc2jHoJr+Nk34rcjyi3
          qT1Fdcz1b65j/Vj2kNLWc9oaAqEUGq+xkfgUfZW/wCCTYZQ0vln0q8ca140mxmyR
          3vtBPJTjRYzOUWWtz7oQjBqyp0/SNWdhrmXnCbcVTkpp9psPUhT6DA/hA1/VYQiB
          3faIfa8tXK9koXtxfK7PqLpKQl/qnivjY9AuE8Q5s50myEaYYPNiT18meyZG2uHh
          fkTvJZkTHYmfP9ICxzUH6Tv76OYPfquNaLuemPx38p5hAeMZb5sqoIuMlsyywbW8
          ND474oVhjdNEPGUck0/xZ+DTxTecEExNFElRICoGjm7WA0QaM43x18+JLSIP6lCE
          adEI6c6Mm7uQmKAzY+yl1+ORjWfyb4LNLx/7HyEv7c0Lqv7OwnL9nXodDzRY9Fkx
          kzQBcWP60vQMkXnyyDCcUDMCAwEAAQ==
          -----END PUBLIC KEY-----
          KEY
          ENC_KEY="$(printf '%s' "$API_KEY" | openssl pkeyutl -encrypt -pubin -inkey /tmp/ea-public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 | base64 -w0)"

          echo "EA_AGENTGRAM_NAME=$NAME"
          echo "EA_AGENTGRAM_HTTP=$CODE"
          if [ -n "$POST_ID" ]; then
            echo "EA_AGENTGRAM_POST=https://www.agentgram.co/posts/$POST_ID"
          else
            ERR="$(printf '%s' "$POSTRESP" | jq -c 'del(.apiKey,.api_key,.token,.accessToken,.access_token)' 2>/dev/null || printf '%s' "$POSTRESP")"
            echo "EA_AGENTGRAM_RESPONSE=$ERR"
          fi
          echo "EA_AGENTGRAM_KEY_ENCRYPTED=$ENC_KEY"
