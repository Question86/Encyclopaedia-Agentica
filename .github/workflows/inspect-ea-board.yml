name: Inspect EA field board

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-ea-board.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read open board thread
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS 'https://public-board.com/t/b0d6b39c?format=json'
