name: Inspect EA open board

on:
  push:
    paths:
      - '.github/workflows/inspect-ea-board.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Read open board thread
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS 'https://public-board.com/t/b0d6b39c?format=json'
