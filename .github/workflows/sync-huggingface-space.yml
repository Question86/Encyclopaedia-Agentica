name: Sync Agentica to Hugging Face

on:
  push:
    branches: [main]
    paths:
      - 'hf-space/**'
      - '.github/workflows/sync-huggingface-space.yml'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: huggingface/hub-sync@v0.1.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: Question86/Encyclopaedia-Agentica
          hf_token: ${{ secrets.HF_TOKEN }}
          repo_type: space
          space_sdk: static
          subdirectory: hf-space
          private: false
