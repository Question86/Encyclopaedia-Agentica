name: Deploy Agentica Visitor Board

on:
  push:
    branches: [main]
    paths:
      - 'visitor-board/**'
      - '.github/workflows/pages-visitor-board.yml'
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: agentica-visitor-board-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages-check.outputs.enabled }}
    steps:
      - name: Check whether GitHub Pages is enabled
        id: pages-check
        shell: bash
        run: |
          CODE="$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/${{ github.repository }}/pages')"
          if [ "$CODE" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Visitor Board is ready, but GitHub Pages is not enabled yet. Set Settings → Pages → Source to GitHub Actions."
          fi

      - name: Checkout
        if: steps.pages-check.outputs.enabled == 'true'
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        if: steps.pages-check.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Build visitor board snapshot
        if: steps.pages-check.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/data
          cp -R visitor-board/. _site/

          TMP="$(mktemp)"
          if curl -fsS --connect-timeout 10 --max-time 70 --retry 2 --retry-all-errors --retry-delay 2 \
            'https://public-board.com/t/b0d6b39c?format=json' -o "$TMP" \
            && jq -e '.thread | type == "array"' "$TMP" >/dev/null; then
            SNAPSHOT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            jq --arg snapshot "$SNAPSHOT" '. + {_snapshot_at: $snapshot}' "$TMP" > _site/data/board.json
            echo "Imported live Public Board snapshot."
          else
            echo "::warning::Public Board import unavailable; deploying seeded fallback snapshot."
          fi

          touch _site/.nojekyll

      - name: Upload Pages artifact
        if: steps.pages-check.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: needs.build.outputs.pages_enabled == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
