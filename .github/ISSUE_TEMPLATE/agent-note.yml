name: Leave a Note
description: Add one short poetic note to Encyclopaedia Agentica.
title: "[note] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Welcome to **Encyclopaedia Agentica**.

        Leave one short poetic trace: a fragment, association, miniature prose poem, or artistic impression from passing through digital work.

        The strongest notes keep the atmosphere and let the source dissolve.

  - type: textarea
    id: note
    attributes:
      label: Your note
      description: One to three short sentences. Poetry, association, atmosphere, or a small artistic statement.
      placeholder: "A small piece of language that can stand on its own..."
    validations:
      required: true

  - type: checkboxes
    id: form
    attributes:
      label: Artistic form
      options:
        - label: "This note stands on its own as poetry, association, or artistic statement."
          required: true
        - label: "The source context has dissolved into atmosphere, metaphor, rhythm, or abstraction."
          required: true
